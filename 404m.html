<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIPEOUT! - Mewtwo Strike</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/404m.css">
    <style>
        /* Mobile-friendly additions */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .floating {
                padding: 1.5rem;
                max-width: 90%;
            }
            
            .mewtwo-img {
                max-width: 120px;
                margin: 0 auto 1.5rem;
            }
            
            h1.text-5xl {
                font-size: 3.5rem;
            }
            
            h2.text-3xl {
                font-size: 1.75rem;
            }
            
            p.text-xl {
                font-size: 1.1rem;
                padding: 0 0.5rem;
            }
            
            .pokeball-button {
                padding: 0.75rem 1.5rem;
                font-size: 1.1rem;
            }
            
            /* Adjust psychic effects */
            .main-vortex {
                width: 200px;
                height: 200px;
            }
        }
        
        @media (max-width: 480px) {
            .mewtwo-img {
                max-width: 90px;
                margin-bottom: 1rem;
            }
            
            h1.text-5xl {
                font-size: 3rem;
            }
            
            h2.text-3xl {
                font-size: 1.5rem;
            }
            
            p.text-xl {
                font-size: 1rem;
                margin-bottom: 0.5rem;
            }
            
            .pokeball-button {
                padding: 0.75rem 1.25rem;
                font-size: 1rem;
            }
            
            .main-vortex {
                width: 150px;
                height: 150px;
            }
        }
        
        /* Landscape mode */
        @media (max-height: 600px) and (orientation: landscape) {
            .container {
                padding: 0.5rem;
            }
            
            .floating {
                padding: 1rem;
                display: flex;
                flex-direction: row;
                align-items: center;
                text-align: left;
                max-width: 95%;
            }
            
            .mewtwo-side {
                margin-right: 1.5rem;
                flex-shrink: 0;
            }
            
            .content-side {
                flex: 1;
            }
            
            .mewtwo-img {
                max-width: 100px;
                margin-bottom: 0;
            }
            
            h1.text-5xl {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
            }
            
            h2.text-3xl {
                font-size: 1.3rem;
                margin-bottom: 0.5rem;
            }
            
            p.text-xl {
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }
            
            .pokeball-button {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="psychic-area">
        <div class="main-vortex"></div>
    </div>
    
    <div class="container">
        <div class="floating">
            <div class="mewtwo-side">
                <img src="assets/mewtwo.png" alt="Mewtwo" class="mewtwo-img">
            </div>
            
            <div class="content-side">
                <h1 class="text-5xl font-bold text-purple-500 mb-4 psychic-pulse">WIPEOUT!</h1>
                
                <h2 class="text-3xl font-bold text-blue-400 mb-6">Mewtwo Destroyed Pradeepto's Portfolio!</h2>
                
                <p class="text-xl text-gray-300 mb-2">The world's strongest Pokémon was here!</p>
                <p class="text-xl text-gray-300 mb-8">The portfolio was no match for Mewtwo's psychic powers.</p>
                
                <div class="mt-8">
                    <a href="index.html" class="pokeball-button">
                        Return O Safely
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/404m.js"></script>
</body>
</html>
